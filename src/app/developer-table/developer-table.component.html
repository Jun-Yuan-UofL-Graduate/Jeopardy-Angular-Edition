<mat-form-field appearance="outline">
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)">
</mat-form-field>

<table mat-table class="table table-striped" matSort [dataSource]="dataSource">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>
    <ng-container matColumnDef="answer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Answer</th>
        <td mat-cell *matCellDef="let element"> {{element.answer}} </td>
    </ng-container>

    <ng-container matColumnDef="question">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Question</th>
        <td mat-cell *matCellDef="let element"> {{element.question}} </td>
    </ng-container>

    <ng-container matColumnDef="beginning">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Beginning</th>
        <td mat-cell *matCellDef="let element"> {{element.beginning}} </td>
    </ng-container>

    <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Value</th>
        <td mat-cell *matCellDef="let element"> {{element.value}} </td>
    </ng-container>

    <ng-container matColumnDef="questionType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Question Type</th>
        <td mat-cell *matCellDef="let element"> {{element.questionType}} </td>
    </ng-container>

    <ng-container matColumnDef="questionSource">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Question Source</th>
        <td mat-cell *matCellDef="let element"> {{element.questionSource}} </td>
    </ng-container>

    <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Action</th>
        <td mat-cell *matCellDef="let element">
            <button class="btn btn-primary" (click)="updateQuestion(element.id)">Update</button> 
            <button class="btn btn-success" (click)="viewQuestion(element.id)">View</button>
            <button class="btn btn-danger" (click)="deleteQuestion(element.id)">Delete</button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [length]="10" [pageSize]="5" [pageSizeOptions]="[5, 10, 15]"></mat-paginator>
