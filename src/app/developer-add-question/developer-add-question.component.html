<h1>Create Question</h1>

<!-- <form (ngSubmit)="onSubmit()"> -->
<form>
<div class="form-group">
    <h2>Category Name: {{currentCategory.catName}}</h2>
</div>

// Due to the nature of Jeopardy, questions and answers are used incorrectly internally. 
// This will be corrected in a future update
<div class="form-group">
    <!-- <label>Question (ie: Square)</label> -->
    <label>Answer (ie: This shape has 4 sides)</label>
    <input type="text" class="form-control" [(ngModel)] = "question.question" id="question" name="question">
</div>

<div class="form-group">
    <!-- <label>Answer (ie: This shape has 4 sides)</label> -->
    <label>Question (ie: Square)</label>
    <input type="text" class="form-control" [(ngModel)] = "question.answer" id="answer" name="answer">
</div>

<div class="form-group">
    <label>Beginning</label>
    <select class="form-control" (change)="changeBeginning($event)" id="beginningMenu" name="beginningMenu">
       <option *ngFor="let beginning of beginnings" [ngValue]="beginning">{{beginning}}</option>
    </select>
    
    <label>Value</label>
    <select class="form-control" (change)="changeValue($event)" id="valueMenu" name="valueMenu">
       <option *ngFor="let value of values" [ngValue]="value">{{value}}</option>
    </select>

    <label>Question Type</label>
    <select class="form-control" (change)="changeType($event)" id="typeMenu" name="typeMenu">
        <option *ngFor="let type of types" [ngValue]="type">{{type}}</option>
    </select>

    <fieldset [disabled]="isDisabled">
        <div class="form-group">
            <label>Media Source</label>
            <input type="text" class="form-control" [(ngModel)] = "question.questionSource" id="questionSource" name="questionSource">
        </div>
    </fieldset>
</div>

<!-- <button class="btn btn-success" type="submit">Submit</button> -->
</form>

<div>
    <button class="btn btn-success" (click)="saveQuestion()">Submit</button>
    <button class="btn btn-danger" (click)="goToDeveloper()">Go Back</button>
</div>
